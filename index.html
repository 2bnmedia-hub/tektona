  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Space Grotesk", "Heebo", "Arial", sans-serif;
      direction: rtl;
      overflow: hidden;
      background: #080808;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { width: 100vw; height: 100vh; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

    /* Keyframes */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInFast {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(-32px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes lineGrow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    @keyframes archFloat {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-20px) rotate(2deg); }
    }
    @keyframes drawLine { from{stroke-dashoffset:1000} to{stroke-dashoffset:0} }
    @keyframes circleGrow { from{stroke-dashoffset:283} }

    /* Calq-style heading underline */
    .calq-heading::after {
      content: '';
      display: block;
      width: 40px;
      height: 2px;
      background: currentColor;
      margin-top: 10px;
      transform-origin: right;
      animation: lineGrow .5s ease forwards;
    }

    /* Top nav link hover */
    .topnav-link {
      position: relative;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    .topnav-link:hover { opacity: 0.6; }
    .topnav-link.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      right: 0; left: 0;
      height: 1px;
      background: currentColor;
    }

    /* Tab hover */
    .tab-btn { transition: color 0.15s, border-color 0.15s; }
    .tab-btn:hover { opacity: 0.75; }

    /* Project card hover */
    .proj-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .proj-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5) !important;
    }

    /* Btn transitions */
    button { transition: opacity 0.15s, background 0.15s, transform 0.1s; }
    button:active { transform: scale(0.97); }

    /* Selection */
    ::selection { background: rgba(255,255,255,0.2); color: #fff; }

    /* Mobile base */
    @media (max-width: 767px) {
      body { overflow: hidden auto; }
      #root { height: auto; min-height: 100vh; }
      .proj-card:hover { transform: none; }
    }

    /* ── TECH EFFECTS ─────────────────────────────── */

    /* Glitch text */
    @keyframes glitch {
      0%,100%  { clip-path: none; transform: none; }
      2%       { clip-path: inset(20% 0 50% 0); transform: translate(-4px, 0); }
      4%       { clip-path: inset(60% 0 20% 0); transform: translate(4px, 0); }
      6%       { clip-path: inset(40% 0 40% 0); transform: translate(-2px, 0); }
      8%       { clip-path: none; transform: none; }
      92%      { clip-path: none; transform: none; }
      94%      { clip-path: inset(10% 0 80% 0); transform: translate(3px, 0); }
      96%      { clip-path: inset(70% 0 10% 0); transform: translate(-3px, 0); }
      98%      { clip-path: none; transform: none; }
    }

    @keyframes glitchBefore {
      0%,100%  { content: 'TEKTONA'; color: #0ff; left: 2px; }
      20%      { content: 'T3KTONA'; color: #f0f; left: -2px; }
      40%      { content: 'TEKTONA'; color: #0ff; left: 2px; }
      60%      { content: 'TEK7ONA'; color: #f0f; left: 0; }
      80%      { content: 'TEKTONA'; color: #0ff; left: -2px; }
    }

    .glitch-text {
      position: relative;
      animation: glitch 6s infinite;
    }
    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0; right: 0;
      opacity: 0.8;
    }
    .glitch-text::before {
      animation: glitchBefore 6s infinite;
      color: #00ffff;
      clip-path: inset(0 0 60% 0);
      transform: translateX(-2px);
    }
    .glitch-text::after {
      color: #ff00ff;
      clip-path: inset(60% 0 0 0);
      transform: translateX(2px);
      animation: glitch 6s .15s infinite;
    }

    /* Scanline overlay */
    @keyframes scanMove {
      0%   { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }
    .scanline-overlay {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
    }
    .scanline-overlay::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(transparent, rgba(255,255,255,0.04), transparent);
      animation: scanMove 4s linear infinite;
    }
    .scanline-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
    }

    /* LED blink */
    @keyframes ledBlink {
      0%,49%,51%,100% { opacity: 1; }
      50%             { opacity: 0.1; }
    }
    @keyframes ledPulse {
      0%,100% { box-shadow: 0 0 4px 1px currentColor; opacity: 1; }
      50%     { box-shadow: 0 0 10px 3px currentColor; opacity: 0.7; }
    }
    .led-active {
      animation: ledPulse 1.5s ease-in-out infinite;
    }
    .led-blink {
      animation: ledBlink 1.2s step-end infinite;
    }

    /* Neon glow pulse */
    @keyframes neonGlow {
      0%,100% { text-shadow: 0 0 8px rgba(255,255,255,0.3), 0 0 20px rgba(255,255,255,0.1); }
      50%     { text-shadow: 0 0 16px rgba(255,255,255,0.6), 0 0 40px rgba(255,255,255,0.2), 0 0 80px rgba(255,255,255,0.1); }
    }
    .neon-text {
      animation: neonGlow 3s ease-in-out infinite;
    }

    /* Border flicker */
    @keyframes borderFlicker {
      0%,100% { opacity: 1; }
      92%     { opacity: 1; }
      93%     { opacity: 0.4; }
      94%     { opacity: 1; }
      96%     { opacity: 0.6; }
      97%     { opacity: 1; }
    }
    .border-flicker {
      animation: borderFlicker 5s infinite;
    }

    /* Data stream (vertical dots) */
    @keyframes dataStream {
      0%   { transform: translateY(-100%); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

    /* Number count up */
    @keyframes countUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Noise flicker on cards */
    @keyframes noiseFlicker {
      0%,100% { opacity: 0; }
      5%      { opacity: 0.02; }
      10%     { opacity: 0; }
      15%     { opacity: 0.03; }
      20%     { opacity: 0; }
    }

    /* Enter button pulse */
    @keyframes btnPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
      50%     { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
    }
    .btn-pulse { animation: btnPulse 2s ease-out infinite; }

    /* Typewriter cursor */
    @keyframes cursorBlink {
      0%,100% { opacity: 1; }
      50%     { opacity: 0; }
    }
    .cursor::after {
      content: '|';
      animation: cursorBlink 1s step-end infinite;
      margin-right: 2px;
    }

    /* Horizontal flicker line */
    @keyframes hFlicker {
      0%,100% { opacity: 0; width: 0; }
      50%     { opacity: 1; width: 100%; }
    }

    /* Active state shimmer */
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer-text {
      background: linear-gradient(90deg, #555 25%, #fff 50%, #555 75%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    /* Gold shimmer heading */
    @keyframes goldShimmer {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
    @keyframes goldGlow {
      0%,100% {
        text-shadow:

          0 0 55px rgba(212,175,55,0.55),

    }
    .shimmer-gold {
      background: linear-gradient(
        90deg,
        #7A5500 0%,
        #B8860B 12%,
        #D4AF37 28%,
        #FEF4E3 50%,
        #D4AF37 72%,
        #B8860B 88%,
        #7A5500 100%

      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: goldShimmer 5s linear infinite, goldGlow 3s ease-in-out infinite;
    }
  </style>

function useIsMobile() {
  const [isMobile, setIsMobile] = React.useState(window.innerWidth < 768);
  React.useEffect(() => {
    const h = () => setIsMobile(window.innerWidth < 768);

  }, []);

const DB_NAME = 'TektonaDB';

function openDB() {

    if (_db) return resolve(_db);

    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('appData')) {
        db.createObjectStore('appData', {
          keyPath: 'id'
        });
      }
    };
    req.onsuccess = e => {
      _db = e.target.result;
      resolve(_db);
    };
    req.onerror = () => reject(req.error);
  });
}

    });
    localStorage.setItem('tektona_backup', JSON.stringify({
      ts: Date.now(),

      ts: Date.now(),
      data
    }));
  }
}

    try {
      const db = await openDB();

      req.onsuccess = () => {
        if (req.result) {
          const {
            id,
            ...data
          } = req.result;
          resolve(data);
        } else {
          const bk = localStorage.getItem('tektona_backup');
          resolve(bk ? JSON.parse(bk).data : null);
        }
      };
      req.onerror = () => resolve(null);
    } catch (e) {
      const bk = localStorage.getItem('tektona_backup');
      resolve(bk ? JSON.parse(bk).data : null);
    }
  });
}
function exportData(data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], {
    type: 'application/json'
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tektona-backup-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

const SESSION_KEY = 'tektona_session';

  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!s) return null;
    if (Date.now() - s.ts > 4 * 60 * 60 * 1000) {
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return s.user;
  } catch {
    return null;
  }
}
function sessionClear() {
  localStorage.removeItem(SESSION_KEY);
}
