    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }

    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

    /* Keyframes */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInFast {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(24px); }

      from { opacity: 0; transform: translateX(-32px); }

    }
    @keyframes lineGrow {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    @keyframes archFloat {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-20px) rotate(2deg); }
    }
    @keyframes drawLine { from{stroke-dashoffset:1000} to{stroke-dashoffset:0} }
    @keyframes circleGrow { from{stroke-dashoffset:283} }

    /* Honeycomb loading spinner — from Uiverse.io by boryanakrasteva */
    @keyframes honeycomb {
      0%, 20%, 80%, 100% { opacity: 0; transform: scale(0); }
      30%, 70% { opacity: 1; transform: scale(1); }
    }
    .honeycomb { height: 24px; position: relative; width: 24px; }
    .honeycomb div {
      animation: honeycomb 2.1s infinite backwards;
      background: currentColor;
      height: 12px;
      margin-top: 6px;
      position: absolute;
      width: 24px;
    }
    .honeycomb div:after, .honeycomb div:before {
      content: '';
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      position: absolute;
      left: 0;
      right: 0;
    }
    .honeycomb div:after { top: -6px; border-bottom: 6px solid currentColor; }
    .honeycomb div:before { bottom: -6px; border-top: 6px solid currentColor; }
    .honeycomb div:nth-child(1) { animation-delay: 0s;    left: -28px; top: 0; }
    .honeycomb div:nth-child(2) { animation-delay: 0.1s;  left: -14px; top: 22px; }
    .honeycomb div:nth-child(3) { animation-delay: 0.2s;  left: 14px;  top: 22px; }
    .honeycomb div:nth-child(4) { animation-delay: 0.3s;  left: 28px;  top: 0; }
    .honeycomb div:nth-child(5) { animation-delay: 0.4s;  left: 14px;  top: -22px; }
    .honeycomb div:nth-child(6) { animation-delay: 0.5s;  left: -14px; top: -22px; }
    .honeycomb div:nth-child(7) { animation-delay: 0.6s;  left: 0;     top: 0; }

    /* Calq-style heading underline */
    .calq-heading::after {
      content: '';
      display: block;
      width: 40px;
      height: 2px;
      background: currentColor;
      margin-top: 10px;
      transform-origin: right;
      animation: lineGrow .5s ease forwards;
    }

    /* Top nav link hover */
    .topnav-link {
      position: relative;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    .topnav-link:hover { opacity: 0.6; }
    .topnav-link.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      right: 0; left: 0;
      height: 1px;
      background: currentColor;
    }

    /* Tab hover */
    .tab-btn { transition: color 0.15s, border-color 0.15s; }
    .tab-btn:hover { opacity: 0.75; }

    /* Project card hover */
    .proj-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .proj-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5) !important;
    }

    /* Btn transitions */
    button { transition: opacity 0.15s, background 0.15s, transform 0.1s; }
    button:active { transform: scale(0.97); }

    /* Selection */
    ::selection { background: rgba(255,255,255,0.2); color: #fff; }

    /* Mobile base */
    @media (max-width: 767px) {
      body { overflow: hidden auto; }
      #root { height: auto; min-height: 100vh; }
      .proj-card:hover { transform: none; }
    }

    /* ── TECH EFFECTS ─────────────────────────────── */

    /* Glitch text */
    @keyframes glitch {
      0%,100%  { clip-path: none; transform: none; }
      2%       { clip-path: inset(20% 0 50% 0); transform: translate(-4px, 0); }
      4%       { clip-path: inset(60% 0 20% 0); transform: translate(4px, 0); }
      6%       { clip-path: inset(40% 0 40% 0); transform: translate(-2px, 0); }
      8%       { clip-path: none; transform: none; }
      92%      { clip-path: none; transform: none; }
      94%      { clip-path: inset(10% 0 80% 0); transform: translate(3px, 0); }
      96%      { clip-path: inset(70% 0 10% 0); transform: translate(-3px, 0); }
      98%      { clip-path: none; transform: none; }
    }

    @keyframes glitchBefore {
      0%,100%  { content: 'TEKTONA'; color: #0ff; left: 2px; }
      20%      { content: 'T3KTONA'; color: #f0f; left: -2px; }
      40%      { content: 'TEKTONA'; color: #0ff; left: 2px; }
      60%      { content: 'TEK7ONA'; color: #f0f; left: 0; }
      80%      { content: 'TEKTONA'; color: #0ff; left: -2px; }
    }

    .glitch-text {
      position: relative;
      animation: glitch 6s infinite;
    }
    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0; right: 0;
      opacity: 0.8;
    }
    .glitch-text::before {
      animation: glitchBefore 6s infinite;
      color: #00ffff;
      clip-path: inset(0 0 60% 0);
      transform: translateX(-2px);
    }
    .glitch-text::after {
      color: #ff00ff;
      clip-path: inset(60% 0 0 0);
      transform: translateX(2px);
      animation: glitch 6s .15s infinite;
    }

    /* Scanline overlay */
    @keyframes scanMove {
      0%   { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }
    .scanline-overlay {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
    }
    .scanline-overlay::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(transparent, rgba(255,255,255,0.04), transparent);
      animation: scanMove 4s linear infinite;
    }
    .scanline-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
    }

    /* LED blink */
    @keyframes ledBlink {
      0%,49%,51%,100% { opacity: 1; }
      50%             { opacity: 0.1; }
    }
    @keyframes ledPulse {
      0%,100% { box-shadow: 0 0 4px 1px currentColor; opacity: 1; }
      50%     { box-shadow: 0 0 10px 3px currentColor; opacity: 0.7; }
    }
    .led-active {
      animation: ledPulse 1.5s ease-in-out infinite;
    }
    .led-blink {
      animation: ledBlink 1.2s step-end infinite;
    }

    /* Neon glow pulse */
    @keyframes neonGlow {
      0%,100% { text-shadow: 0 0 8px rgba(255,255,255,0.3), 0 0 20px rgba(255,255,255,0.1); }
      50%     { text-shadow: 0 0 16px rgba(255,255,255,0.6), 0 0 40px rgba(255,255,255,0.2), 0 0 80px rgba(255,255,255,0.1); }
    }
    .neon-text {
      animation: neonGlow 3s ease-in-out infinite;
    }

    /* Border flicker */
    @keyframes borderFlicker {
      0%,100% { opacity: 1; }
      92%     { opacity: 1; }
      93%     { opacity: 0.4; }
      94%     { opacity: 1; }
      96%     { opacity: 0.6; }
      97%     { opacity: 1; }
    }
    .border-flicker {
      animation: borderFlicker 5s infinite;
    }

    /* Data stream (vertical dots) */
    @keyframes dataStream {
      0%   { transform: translateY(-100%); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

    /* Number count up */
    @keyframes countUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Noise flicker on cards */
    @keyframes noiseFlicker {
      0%,100% { opacity: 0; }
      5%      { opacity: 0.02; }
      10%     { opacity: 0; }
      15%     { opacity: 0.03; }
      20%     { opacity: 0; }
    }

    /* Enter button pulse */
    @keyframes btnPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
      50%     { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
    }
    .btn-pulse { animation: btnPulse 2s ease-out infinite; }

    /* Typewriter cursor */
    @keyframes cursorBlink {
      0%,100% { opacity: 1; }
      50%     { opacity: 0; }
    }
    .cursor::after {
      content: '|';
      animation: cursorBlink 1s step-end infinite;
      margin-right: 2px;
    }

    /* Horizontal flicker line */
    @keyframes hFlicker {
      0%,100% { opacity: 0; width: 0; }
      50%     { opacity: 1; width: 100%; }
    }

      0%   { background-position: -200% 0; }

      background: linear-gradient(90deg, #555 25%, #fff 50%, #555 75%);
